name: Build moo_lan_tv APKs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build TV APK
      run: gradle :tv:assembleDebug

    - name: Build Mobile Companion APK
      run: gradle :mobile:assembleDebug

    - name: Upload TV Launcher APK
      uses: actions/upload-artifact@v4
      with:
        name: moo_lan_tv_TV_Launcher
        path: tv/build/outputs/apk/debug/*.apk

    - name: Upload Mobile Companion APK
      uses: actions/upload-artifact@v4
      with:
        name: moo_lan_tv_Mobile_Remote
        path: mobile/build/outputs/apk/debug/*.apk
